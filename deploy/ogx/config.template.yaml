version: 2
distro_name: starter
apis:
  - batches
  - file_processors
  - files
  - inference
  - interactions
  - messages
  - responses
  - skills
  - tool_runtime
  - vector_io
providers:
  inference:
    - provider_id: openai
      provider_type: remote::openai
      config:
        api_key: __DEEPSEEK_API_KEY__
        base_url: https://api.deepseek.com/v1
        network:
          tls:
            verify: true
storage:
  backends:
    kv_default:
      type: kv_sqlite
      db_path: /data/ogx_kvstore.db
    sql_default:
      type: sql_sqlite
      db_path: /data/ogx_sqlstore.db
stores:
  metadata:
    namespace: registry
    backend: kv_default
  inference:
    table_name: inference_store
    backend: sql_default
    max_write_queue_size: 10000
    num_writers: 4
  conversations:
    table_name: openai_conversations
    backend: sql_default
  prompts:
    table_name: prompts
    backend: sql_default
  connectors:
    table_name: connectors
    backend: sql_default
registered_resources:
  models:
    - metadata: {}
      model_id: deepseek-v4-flash
      provider_id: all
      provider_model_id: auto
      model_type: llm
    - metadata: {}
      model_id: deepseek-v4-pro
      provider_id: all
      provider_model_id: auto
      model_type: llm
  vector_stores: []
