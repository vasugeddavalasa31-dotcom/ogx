# Force Railway to build with our Dockerfile (Railpack's Python auto-detect
# would otherwise guess wrong and fail with "no start command").
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "bash deploy/ogx/entrypoint.sh"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
numReplicas = 1
